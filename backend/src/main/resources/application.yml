server:
  port: ${PORT:8080}

spring:
  application:
    name: quality-trace
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app_db}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-please-change-in-prod-0123456789}
    expire-seconds: ${JWT_EXPIRE_SECONDS:43200}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:300}

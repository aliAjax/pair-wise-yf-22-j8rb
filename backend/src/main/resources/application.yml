server:
  port: ${PORT:8080}

spring:
  application:
    name: quality-trace
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app_db}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-please-change}
    ttl-seconds: ${JWT_TTL_SECONDS:28800}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:300}

logging:
  level:
    com.generated.qualityTrace: ${LOG_LEVEL:INFO}
